<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
  <!-- ═══════════════════════════════════════════════ -->
  <!--   LINK HUB — Meta & SEO                        -->
  <!-- ═══════════════════════════════════════════════ -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <!-- Primary SEO -->
  <title id="page-title">Link Hub</title>
  <meta name="description" id="page-description" content="Personal Link Hub" />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" id="theme-color" content="#6C63FF" />

  <!-- OpenGraph (Telegram, WhatsApp, Instagram preview) -->
  <meta property="og:type" content="profile" />
  <meta property="og:title" id="og-title" content="Link Hub" />
  <meta property="og:description" id="og-description" content="Personal Link Hub" />
  <meta property="og:image" id="og-image" content="og-image.webp" />
  <meta property="og:url" id="og-url" content="" />
  <meta property="og:site_name" content="Link Hub" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" id="tw-title" content="Link Hub" />
  <meta name="twitter:description" id="tw-description" content="Personal Link Hub" />
  <meta name="twitter:image" id="tw-image" content="og-image.webp" />

  <!-- Canonical -->
  <link rel="canonical" id="canonical" href="" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔗</text></svg>" />

  <style>
    /* ════════════════════════════════════════════════
       DESIGN TOKENS & CSS VARIABLES
    ════════════════════════════════════════════════ */
    :root {
      --font-sans: 'Inter', 'Plus Jakarta Sans', system-ui, sans-serif;
      --font-display: 'Plus Jakarta Sans', 'Inter', sans-serif;

      /* Brand */
      --accent-1: #7C3AED;
      --accent-2: #6C63FF;
      --accent-3: #A78BFA;

      /* Dark Mode (default) */
      --bg-base: #080B14;
      --bg-surface: rgba(255, 255, 255, 0.04);
      --bg-surface-hover: rgba(255, 255, 255, 0.08);
      --bg-card: rgba(255, 255, 255, 0.05);
      --bg-card-hover: rgba(255, 255, 255, 0.09);
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.18);
      --text-primary: #F8FAFC;
      --text-secondary: rgba(248, 250, 252, 0.65);
      --text-muted: rgba(248, 250, 252, 0.40);
      --shadow-glow: 0 0 40px rgba(108, 99, 255, 0.15);
      --shadow-card: 0 4px 24px rgba(0,0,0,0.4);
      --shadow-card-hover: 0 12px 40px rgba(0,0,0,0.5);

      /* Radii */
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-xl: 32px;
      --radius-full: 9999px;

      /* Transitions */
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-fast: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-slow: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);

      /* Layout */
      --container-max: 520px;
      --page-padding: 16px;
    }

    [data-theme="light"] {
      --bg-base: #F0F4FF;
      --bg-surface: rgba(255, 255, 255, 0.85);
      --bg-surface-hover: rgba(255, 255, 255, 0.95);
      --bg-card: rgba(255, 255, 255, 0.80);
      --bg-card-hover: rgba(255, 255, 255, 1);
      --border: rgba(0, 0, 0, 0.08);
      --border-hover: rgba(108, 99, 255, 0.35);
      --text-primary: #0F172A;
      --text-secondary: rgba(15, 23, 42, 0.70);
      --text-muted: rgba(15, 23, 42, 0.45);
      --shadow-glow: 0 0 40px rgba(108, 99, 255, 0.12);
      --shadow-card: 0 2px 16px rgba(0,0,0,0.08);
      --shadow-card-hover: 0 8px 32px rgba(108, 99, 255, 0.18);
    }

    /* ════════════════════════════════════════════════
       RESET & BASE
    ════════════════════════════════════════════════ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-base);
      color: var(--text-primary);
      min-height: 100dvh;
      overflow-x: hidden;
      transition: background-color 0.4s ease, color 0.4s ease;
      position: relative;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button {
      cursor: pointer;
      font-family: inherit;
      border: none;
      background: none;
    }

    img {
      display: block;
      max-width: 100%;
    }

    /* ════════════════════════════════════════════════
       ANIMATED BACKGROUND
    ════════════════════════════════════════════════ */
    .bg-orbs {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.5;
      animation: orbFloat 12s ease-in-out infinite;
    }

    .orb-1 {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, #7C3AED, transparent 70%);
      top: -120px;
      right: -80px;
      animation-delay: 0s;
    }

    .orb-2 {
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, #06B6D4, transparent 70%);
      bottom: 10%;
      left: -80px;
      animation-delay: -4s;
    }

    .orb-3 {
      width: 250px;
      height: 250px;
      background: radial-gradient(circle, #F59E0B, transparent 70%);
      top: 45%;
      right: 10%;
      animation-delay: -8s;
      opacity: 0.3;
    }

    [data-theme="light"] .orb {
      opacity: 0.2;
    }

    @keyframes orbFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33%       { transform: translate(30px, -20px) scale(1.05); }
      66%       { transform: translate(-20px, 15px) scale(0.96); }
    }

    /* Noise texture overlay */
    .bg-noise {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: 0.025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-size: 256px;
    }

    /* ════════════════════════════════════════════════
       LAYOUT WRAPPER
    ════════════════════════════════════════════════ */
    .page-wrapper {
      position: relative;
      z-index: 2;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: var(--container-max);
      padding: 0 var(--page-padding);
      padding-top: env(safe-area-inset-top, 0);
      padding-bottom: calc(env(safe-area-inset-bottom, 0) + 80px);
    }

    /* ════════════════════════════════════════════════
       TOP BAR (Theme toggle)
    ════════════════════════════════════════════════ */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      width: 100%;
      display: flex;
      justify-content: flex-end;
      padding: 16px var(--page-padding);
      max-width: var(--container-max);
      margin: 0 auto;
    }

    .theme-toggle {
      width: 42px;
      height: 42px;
      border-radius: var(--radius-full);
      background: var(--bg-card);
      border: 1px solid var(--border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
      font-size: 18px;
      box-shadow: var(--shadow-card);
    }

    .theme-toggle:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-hover);
      transform: scale(1.08);
    }

    .theme-toggle:active {
      transform: scale(0.94);
    }

    /* ════════════════════════════════════════════════
       HEADER — Profile Section
    ════════════════════════════════════════════════ */
    .header {
      padding: 12px 0 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      animation: fadeInUp 0.6s ease both;
    }

    /* Avatar */
    .avatar-wrap {
      position: relative;
      display: inline-flex;
    }

    .avatar-ring {
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7C3AED, #6C63FF, #06B6D4);
      z-index: 0;
      animation: spin 4s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .avatar-ring::before {
      content: '';
      position: absolute;
      inset: 3px;
      border-radius: 50%;
      background: var(--bg-base);
      transition: background 0.4s ease;
    }

    .avatar-img {
      position: relative;
      z-index: 1;
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--bg-base);
    }

    .avatar-placeholder {
      position: relative;
      z-index: 1;
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7C3AED, #6C63FF);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: 700;
      color: white;
      border: 3px solid var(--bg-base);
      font-family: var(--font-display);
    }

    .verified-badge {
      position: absolute;
      bottom: 2px;
      right: 2px;
      z-index: 2;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3B82F6, #2563EB);
      border: 2px solid var(--bg-base);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }

    /* Profile Info */
    .profile-info {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .profile-name {
      font-family: var(--font-display);
      font-size: 1.625rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
      background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent-3) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .profile-username {
      font-size: 0.875rem;
      color: var(--accent-3);
      font-weight: 500;
      letter-spacing: 0.01em;
    }

    .profile-tagline {
      font-size: 0.9375rem;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: -0.01em;
    }

    .profile-bio {
      font-size: 0.875rem;
      color: var(--text-muted);
      line-height: 1.6;
      max-width: 320px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: var(--radius-full);
      background: var(--bg-card);
      border: 1px solid var(--border);
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text-secondary);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    /* ════════════════════════════════════════════════
       SOCIAL BAR
    ════════════════════════════════════════════════ */
    .social-bar {
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 0 0 28px;
      flex-wrap: wrap;
      animation: fadeInUp 0.6s 0.1s ease both;
    }

    .social-btn {
      position: relative;
      width: 46px;
      height: 46px;
      border-radius: var(--radius-md);
      background: var(--bg-card);
      border: 1px solid var(--border);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
      overflow: hidden;
      box-shadow: var(--shadow-card);
    }

    .social-btn svg {
      width: 20px;
      height: 20px;
      fill: var(--text-secondary);
      transition: var(--transition);
      position: relative;
      z-index: 1;
    }

    .social-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--social-color, var(--accent-2));
      opacity: 0;
      transition: var(--transition);
    }

    .social-btn:hover {
      border-color: transparent;
      transform: translateY(-3px) scale(1.08);
      box-shadow: var(--shadow-card-hover), 0 0 20px var(--social-color, var(--accent-2));
    }

    .social-btn:hover::before {
      opacity: 1;
    }

    .social-btn:hover svg {
      fill: #fff;
    }

    .social-btn:active {
      transform: translateY(0) scale(0.96);
    }

    /* Tooltip */
    .social-btn .tooltip {
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      transform: translateX(-50%) translateY(4px);
    }

    .social-btn:hover .tooltip {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ════════════════════════════════════════════════
       SECTION LABEL
    ════════════════════════════════════════════════ */
    .section-label {
      font-size: 0.6875rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ════════════════════════════════════════════════
       BENTO LINKS GRID
    ════════════════════════════════════════════════ */
    .links-section {
      margin-bottom: 24px;
      animation: fadeInUp 0.6s 0.15s ease both;
    }

    .bento-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .link-card {
      position: relative;
      border-radius: var(--radius-lg);
      background: var(--bg-card);
      border: 1px solid var(--border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      overflow: hidden;
      transition: var(--transition);
      cursor: pointer;
      box-shadow: var(--shadow-card);
      display: block;
      text-decoration: none;
      color: inherit;
    }

    .link-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-3px);
      box-shadow: var(--shadow-card-hover);
    }

    .link-card:active {
      transform: translateY(0) scale(0.98);
    }

    /* Featured (full-width) card */
    .link-card.featured {
      grid-column: 1 / -1;
    }

    /* Gradient overlay on card */
    .card-gradient {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    .link-card:hover .card-gradient {
      opacity: 1;
    }

    /* Card content */
    .card-inner {
      position: relative;
      z-index: 1;
      padding: 18px 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .link-card.featured .card-inner {
      padding: 22px 22px 18px;
      flex-direction: row;
      align-items: center;
      gap: 16px;
    }

    .card-icon-wrap {
      flex-shrink: 0;
      width: 48px;
      height: 48px;
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      transition: var(--transition);
    }

    .link-card.featured .card-icon-wrap {
      width: 56px;
      height: 56px;
      font-size: 26px;
    }

    .link-card:hover .card-icon-wrap {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.1);
    }

    .card-text {
      flex: 1;
      min-width: 0;
    }

    .card-title {
      font-family: var(--font-display);
      font-size: 0.9375rem;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: var(--transition);
    }

    .link-card.featured .card-title {
      font-size: 1.0625rem;
      white-space: normal;
    }

    .link-card:hover .card-title {
      color: white;
    }

    .card-subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.4;
      transition: var(--transition);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .link-card.featured .card-subtitle {
      white-space: normal;
    }

    .link-card:hover .card-subtitle {
      color: rgba(255, 255, 255, 0.75);
    }

    .card-arrow {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }

    .link-card:hover .card-arrow {
      background: rgba(255, 255, 255, 0.25);
      transform: translate(2px, -2px);
    }

    .card-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      padding: 3px 10px;
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      font-size: 0.6875rem;
      font-weight: 700;
      color: white;
      letter-spacing: 0.02em;
      z-index: 2;
    }

    /* Card gradient backgrounds */
    .grad-violet  { background: linear-gradient(135deg, #7C3AED, #9C27B0); }
    .grad-red     { background: linear-gradient(135deg, #EF4444, #DC2626); }
    .grad-blue    { background: linear-gradient(135deg, #3B82F6, #0891B2); }
    .grad-emerald { background: linear-gradient(135deg, #10B981, #0D9488); }
    .grad-amber   { background: linear-gradient(135deg, #F59E0B, #EA580C); }

    /* ════════════════════════════════════════════════
       CONTACT INFO BLOCK
    ════════════════════════════════════════════════ */
    .contact-section {
      margin-bottom: 24px;
      animation: fadeInUp 0.6s 0.2s ease both;
    }

    .contact-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-radius: var(--radius-md);
      background: var(--bg-card);
      border: 1px solid var(--border);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: var(--transition);
      cursor: pointer;
      box-shadow: var(--shadow-card);
      position: relative;
    }

    .contact-item:hover {
      border-color: var(--border-hover);
      background: var(--bg-card-hover);
      transform: translateX(3px);
    }

    .contact-item:active {
      transform: translateX(0) scale(0.98);
    }

    .contact-icon {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .contact-text {
      flex: 1;
      min-width: 0;
    }

    .contact-label {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    .contact-value {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-primary);
      margin-top: 1px;
    }

    .copy-hint {
      font-size: 0.7rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
      transition: var(--transition);
    }

    .contact-item:hover .copy-hint {
      color: var(--accent-3);
    }

    /* ════════════════════════════════════════════════
       ACTION BUTTONS ROW
    ════════════════════════════════════════════════ */
    .actions-section {
      margin-bottom: 24px;
      animation: fadeInUp 0.6s 0.25s ease both;
    }

    .actions-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .action-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 20px;
      border-radius: var(--radius-md);
      font-size: 0.875rem;
      font-weight: 600;
      transition: var(--transition);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-card);
      letter-spacing: -0.01em;
    }

    .action-btn svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .action-btn-primary {
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      color: white;
      border-color: transparent;
    }

    .action-btn-primary:hover {
      opacity: 0.9;
      transform: translateY(-2px);
      box-shadow: var(--shadow-card-hover), 0 8px 24px rgba(108, 99, 255, 0.35);
    }

    .action-btn-secondary {
      background: var(--bg-card);
      color: var(--text-primary);
    }

    .action-btn-secondary:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-hover);
      transform: translateY(-2px);
    }

    .action-btn:active {
      transform: translateY(0) scale(0.97);
    }

    /* ════════════════════════════════════════════════
       FOOTER
    ════════════════════════════════════════════════ */
    .footer {
      padding: 24px 0 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      animation: fadeInUp 0.6s 0.3s ease both;
    }

    .footer-copyright {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .footer-made {
      font-size: 0.75rem;
      color: var(--text-muted);
      opacity: 0.6;
    }

    /* ════════════════════════════════════════════════
       TOAST NOTIFICATION
    ════════════════════════════════════════════════ */
    .toast-container {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      flex-direction: column-reverse;
      gap: 8px;
      pointer-events: none;
      width: calc(100% - 32px);
      max-width: 340px;
    }

    .toast {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 18px;
      border-radius: var(--radius-md);
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: white;
      font-size: 0.875rem;
      font-weight: 500;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      animation: toastIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      pointer-events: none;
    }

    .toast.hide {
      animation: toastOut 0.3s ease forwards;
    }

    .toast-icon {
      font-size: 18px;
      flex-shrink: 0;
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.92);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes toastOut {
      to {
        opacity: 0;
        transform: translateY(8px) scale(0.94);
      }
    }

    /* ════════════════════════════════════════════════
       MODAL (Share Drawer)
    ════════════════════════════════════════════════ */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 500;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 0 12px 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-sheet {
      width: 100%;
      max-width: var(--container-max);
      background: var(--bg-base);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl) var(--radius-xl) var(--radius-lg) var(--radius-lg);
      padding: 8px 20px 24px;
      transform: translateY(30px);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 -8px 40px rgba(0,0,0,0.4);
    }

    .modal-backdrop.open .modal-sheet {
      transform: translateY(0);
    }

    .modal-handle {
      width: 40px;
      height: 4px;
      border-radius: 2px;
      background: var(--border-hover);
      margin: 12px auto 20px;
    }

    .modal-title {
      font-family: var(--font-display);
      font-size: 1.125rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 20px;
      color: var(--text-primary);
    }

    .qr-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }

    #qr-canvas {
      border-radius: var(--radius-md);
      border: 8px solid white;
      box-shadow: var(--shadow-card);
    }

    .share-url-box {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      background: var(--bg-surface);
      border: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .share-url-text {
      flex: 1;
      font-size: 0.875rem;
      color: var(--text-secondary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .share-copy-btn {
      flex-shrink: 0;
      padding: 6px 14px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      color: white;
      font-size: 0.8125rem;
      font-weight: 600;
      transition: var(--transition-fast);
    }

    .share-copy-btn:hover {
      opacity: 0.88;
    }

    .share-copy-btn:active {
      transform: scale(0.96);
    }

    .modal-close {
      width: 100%;
      padding: 13px;
      border-radius: var(--radius-md);
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 0.9375rem;
      font-weight: 600;
      transition: var(--transition-fast);
    }

    .modal-close:hover {
      background: var(--bg-card-hover);
    }

    /* ════════════════════════════════════════════════
       SKELETON LOADER
    ════════════════════════════════════════════════ */
    .skeleton {
      background: linear-gradient(90deg,
        var(--bg-surface) 25%,
        var(--bg-card-hover) 50%,
        var(--bg-surface) 75%
      );
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: var(--radius-md);
    }

    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ════════════════════════════════════════════════
       ENTRANCE ANIMATIONS
    ════════════════════════════════════════════════ */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(24px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ════════════════════════════════════════════════
       SCROLL-REVEAL
    ════════════════════════════════════════════════ */
    .reveal {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ════════════════════════════════════════════════
       RIPPLE EFFECT
    ════════════════════════════════════════════════ */
    .ripple-container {
      position: relative;
      overflow: hidden;
    }

    .ripple {
      position: absolute;
      border-radius: 50%;
      transform: scale(0);
      background: rgba(255, 255, 255, 0.18);
      animation: ripple-anim 0.6s linear;
      pointer-events: none;
    }

    @keyframes ripple-anim {
      to {
        transform: scale(4);
        opacity: 0;
      }
    }

    /* ════════════════════════════════════════════════
       RESPONSIVE
    ════════════════════════════════════════════════ */
    @media (max-width: 380px) {
      :root {
        --page-padding: 12px;
      }
      .profile-name { font-size: 1.4rem; }
      .bento-grid { gap: 8px; }
      .actions-row { grid-template-columns: 1fr; }
    }

    @media (min-width: 768px) {
      :root {
        --page-padding: 24px;
      }
      .avatar-img, .avatar-placeholder { width: 110px; height: 110px; }
      .profile-name { font-size: 1.875rem; }
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    /* Selection */
    ::selection {
      background: rgba(108, 99, 255, 0.35);
      color: var(--text-primary);
    }
  </style>
</head>

  <script>
  /* ─── Tiny QR Generator (inline, no deps) ─────────
     Minimal QR code drawn on canvas via API
  ───────────────────────────────────────────────── */
  // We'll use Google Charts API for QR (no JS needed)
  // But for offline support, draw a simple colored square placeholder
  function renderQR(url, canvasEl) {
    const size = 180;
    const ctx = canvasEl.getContext('2d');
    const apiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&data=${encodeURIComponent(url)}&color=6C63FF&bgcolor=ffffff&margin=0`;
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      ctx.clearRect(0, 0, size, size);
      ctx.drawImage(img, 0, 0, size, size);
    };
    img.onerror = () => {
      // Fallback: gradient square
      const grad = ctx.createLinearGradient(0, 0, size, size);
      grad.addColorStop(0, '#7C3AED');
      grad.addColorStop(1, '#6C63FF');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, size, size);
      ctx.fillStyle = 'white';
      ctx.font = 'bold 14px Inter';
      ctx.textAlign = 'center';
      ctx.fillText('QR Code', size/2, size/2 - 8);
      ctx.font = '11px Inter';
      ctx.fillText('(internet kerak)', size/2, size/2 + 12);
    };
    img.src = apiUrl;
  }
  </script>

    const CARD_ICONS = {

      t.className = 'toast';
      t.innerHTML = `<span class="toast-icon">${emoji}</span><span>${message}</span>`;
      toastContainer.prepend(t);
      setTimeout(() => {
        t.classList.add('hide');
        setTimeout(() => t.remove(), 350);
      }, duration);
    }

    // ─── Copy to Clipboard ────────────────────────
    function copyToClipboard(text, label) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => {
          showToast(`${label} nusxalandi!`, '📋');
        });
      } else {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
        showToast(`${label} nusxalandi!`, '📋');
      }
    }

    // ─── Ripple Effect ────────────────────────────
    function addRipple(el) {
      el.addEventListener('click', function(e) {
        const rect = el.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height);
        const x = e.clientX - rect.left - size / 2;
        const y = e.clientY - rect.top  - size / 2;
        const ripple = document.createElement('span');
        ripple.className = 'ripple';
        ripple.style.cssText = `
          width: ${size}px; height: ${size}px;
          left: ${x}px; top: ${y}px;
        `;
        el.appendChild(ripple);
        setTimeout(() => ripple.remove(), 600);
      });
    }

    // ─── Track Click (UTM / Analytics) ───────────
    function trackClick(id, url) {
      // Google Analytics 4
      if (typeof gtag !== 'undefined') {
        gtag('event', 'link_click', { link_id: id, link_url: url });
      }
      // Console log for debug
      console.log('[LinkHub] Click tracked:', id, url);
    }

    // ─── Render Profile Header ────────────────────
    function renderHeader(cfg) {
      // SEO
      document.getElementById('page-title').textContent         = cfg.seo.title;
      document.getElementById('page-description').content       = cfg.seo.description;
      document.getElementById('og-title').content               = cfg.seo.title;
      document.getElementById('og-description').content         = cfg.seo.description;
      document.getElementById('og-image').content               = cfg.seo.ogImage;
      document.getElementById('og-url').content                 = cfg.seo.siteUrl;
      document.getElementById('tw-title').content               = cfg.seo.title;
      document.getElementById('tw-description').content         = cfg.seo.description;
      document.getElementById('tw-image').content               = cfg.seo.ogImage;
      document.getElementById('canonical').href                 = cfg.seo.siteUrl;
      document.getElementById('theme-color').content            = cfg.seo.themeColor;

      // Avatar
      const avatarImg = document.getElementById('avatar-img');
      const avatarPlaceholder = document.getElementById('avatar-placeholder');
      if (cfg.avatar) {
        avatarImg.src  = cfg.avatar;
        avatarImg.alt  = cfg.name;
      } else {
        avatarImg.style.display = 'none';
        avatarPlaceholder.style.display = 'flex';
        avatarPlaceholder.textContent = cfg.name.charAt(0).toUpperCase();
      }

      // Verified badge
      if (!cfg.verified) {
        document.getElementById('verified-badge').style.display = 'none';
      }

      // Info
      document.getElementById('profile-name').textContent     = cfg.name;
      document.getElementById('profile-username').textContent = cfg.username;
      document.getElementById('profile-tagline').textContent  = cfg.tagline;
      document.getElementById('profile-bio').textContent      = cfg.bio;
      document.getElementById('profile-status').textContent   = cfg.status;
      document.getElementById('footer-copyright').textContent = cfg.footer.copyright;
    }

    // ─── Render Social Bar ────────────────────────
    function renderSocials(socials) {
      const bar = document.getElementById('social-bar');
      bar.innerHTML = '';
      socials.forEach(s => {
        const svgIcon = SOCIAL_ICONS[s.icon] || SOCIAL_ICONS['link'] || '🔗';
        const btn = document.createElement('a');
        btn.href   = s.url;
        btn.target = '_blank';
        btn.rel    = 'noopener noreferrer';
        btn.className = 'social-btn';
        btn.style.setProperty('--social-color', s.color);
        btn.setAttribute('aria-label', s.label);
        btn.innerHTML = `${svgIcon}<span class="tooltip">${s.label}</span>`;
        btn.addEventListener('click', () => trackClick(s.platform, s.url));
        bar.appendChild(btn);
      });
    }

    // ─── Render Bento Grid ────────────────────────
    function renderLinks(links) {
      const grid = document.getElementById('bento-grid');
      grid.innerHTML = '';

      links.forEach((link, i) => {
        const gradInfo = GRAD_MAP[link.gradient] || { css: 'linear-gradient(135deg, #7C3AED, #6C63FF)', cls: 'grad-violet' };
        const icon = CARD_ICONS[link.icon] || '🔗';
        const delay = (i * 0.07).toFixed(2);

        const card = document.createElement('a');
        card.href   = link.url;
        card.target = '_blank';
        card.rel    = 'noopener noreferrer';
        card.className = `link-card ripple-container${link.isFeatured ? ' featured' : ''}`;
        card.id     = `link-${link.id}`;
        card.style.animationDelay = `${delay}s`;
        card.setAttribute('aria-label', link.title);

        card.innerHTML = `
          <div class="card-gradient ${gradInfo.cls}"></div>
          ${link.badge ? `<span class="card-badge">${link.badge}</span>` : ''}
          <div class="card-inner">
            <div class="card-icon-wrap">${icon}</div>
            <div class="card-text">
              <p class="card-title">${link.title}</p>
              ${link.subtitle ? `<p class="card-subtitle">${link.subtitle}</p>` : ''}
            </div>
            ${link.isFeatured ? `
              <div class="card-arrow" aria-hidden="true">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                  <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
              </div>` : ''}
          </div>
        `;

        card.addEventListener('click', (e) => {
          trackClick(link.id, link.url);
        });

        addRipple(card);
        grid.appendChild(card);
      });
    }

    // ─── Render Contact Grid ──────────────────────
    function renderContact(contact) {
      const grid = document.getElementById('contact-grid');
      grid.innerHTML = '';

      const items = [
        { label: 'Telefon', value: contact.phone, icon: '📞', copy: contact.phone.replace(/\s/g, '') },
        { label: 'Email',   value: contact.email,   icon: '✉️',  copy: contact.email },
        { label: 'Joylashuv', value: contact.location, icon: '📍', copy: null },
      ];

      items.forEach(item => {
        const el = document.createElement('div');
        el.className = 'contact-item';
        el.setAttribute('role', item.copy ? 'button' : 'presentation');
        if (item.copy) {
          el.setAttribute('tabindex', '0');
          el.setAttribute('title', 'Nusxalash uchun bosing');
        }
        el.innerHTML = `
          <div class="contact-icon">${item.icon}</div>
          <div class="contact-text">
            <p class="contact-label">${item.label}</p>
            <p class="contact-value">${item.value}</p>
          </div>
          ${item.copy ? `
            <div class="copy-hint" aria-hidden="true">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
              </svg>
              Nusxa
            </div>` : ''}
        `;

        if (item.copy) {
          const doClick = () => copyToClipboard(item.copy, item.label);
          el.addEventListener('click', doClick);
          el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') doClick(); });
        }

        grid.appendChild(el);
      });
    }

    // ─── vCard / Save to Contacts ─────────────────
    function generateVCard(vc) {
      return [
        'BEGIN:VCARD',
        'VERSION:3.0',
        `N:${vc.lastName};${vc.firstName};;;`,
        `FN:${vc.firstName} ${vc.lastName}`,
        `ORG:${vc.org}`,
        `TITLE:${vc.title}`,
        `TEL;TYPE=CELL:${vc.phone}`,
        `EMAIL:${vc.email}`,
        `URL:${vc.website}`,
        `X-SOCIALPROFILE;type=telegram:${vc.telegram}`,
        `X-SOCIALPROFILE;type=instagram:${vc.instagram}`,
        'END:VCARD'
      ].join('\n');
    }

    function downloadVCard(cfg) {
      const vcardStr  = generateVCard(cfg.vcard);
      const blob      = new Blob([vcardStr], { type: 'text/vcard;charset=utf-8' });
      const url       = URL.createObjectURL(blob);
      const a         = document.createElement('a');
      a.href          = url;
      a.download      = `${cfg.vcard.firstName}_${cfg.vcard.lastName}.vcf`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Kontakt saqlandi (.vcf fayl)', '👤');
      trackClick('save_contact', 'vcard');
    }

    // ─── Share Modal ──────────────────────────────
    const modal      = document.getElementById('share-modal');
    const shareUrl   = document.getElementById('share-url-text');
    const closeBtnEl = document.getElementById('modal-close-btn');
    const copyBtnEl  = document.getElementById('share-copy-btn');
    let qrRendered   = false;

    function openShareModal(cfg) {
      const url = cfg.seo.siteUrl || window.location.href;
      shareUrl.textContent = url;
      modal.classList.add('open');
      document.body.style.overflow = 'hidden';

      if (!qrRendered) {
        renderQR(url, document.getElementById('qr-canvas'));
        qrRendered = true;
      }
    }

    function closeShareModal() {
      modal.classList.remove('open');
      document.body.style.overflow = '';
    }

    closeBtnEl.addEventListener('click', closeShareModal);
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeShareModal();
    });

    copyBtnEl.addEventListener('click', () => {
      const url = shareUrl.textContent;
      copyToClipboard(url, 'Havola');
      // Native share if available
      if (navigator.share) {
        navigator.share({ title: document.title, url });
      }
    });

    // ─── Intersection Observer (scroll reveal) ────
    const reveals = document.querySelectorAll('.reveal');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });

    reveals.forEach(el => observer.observe(el));

    // ─── INIT ─────────────────────────────────────
    function init() {
      const cfg = typeof profileConfig !== 'undefined' ? profileConfig : null;
      if (!cfg) {
        console.error('[LinkHub] profile.config.js topilmadi!');
        return;
      }

      renderHeader(cfg);
      renderSocials(cfg.socials);
      renderLinks(cfg.links);
      renderContact(cfg.contact);

      // Button listeners
      document.getElementById('save-contact-btn').addEventListener('click', () => {
        downloadVCard(cfg);
      });
      addRipple(document.getElementById('save-contact-btn'));

      document.getElementById('share-btn').addEventListener('click', () => {
        openShareModal(cfg);
      });
      addRipple(document.getElementById('share-btn'));

      // Keyboard: Escape closes modal
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeShareModal();
      });

      console.log('[LinkHub] ✅ Initialized successfully');
    }

    // DOM ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }

  })();
  </script>
